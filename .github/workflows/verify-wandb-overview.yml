name: Verify public native W&B overview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_read:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 verify_wandb_overview_public.py
