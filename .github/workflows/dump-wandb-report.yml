name: Dump W&B report spec (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      WANDB_API_KEY: ${{ secrets.WANDB_BACKFILL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install -q wandb wandb-workspaces
      - run: python3 dump_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: report-dump
          path: report_dump.json
