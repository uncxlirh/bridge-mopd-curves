name: Check public W&B pages in browser
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Import histories into official W&B, Update native W&B overview views]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python check_wandb_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-pages
          path: browser-pages/
